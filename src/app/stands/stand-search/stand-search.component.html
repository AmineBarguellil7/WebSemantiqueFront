<div class="container">
    <h4>Les articles filtrés suivant {{filterType}} sont :</h4>
    <div class="row">
        <div class="col-md-4" *ngFor="let stand of SearchData">
            <div class="list-group-item clearfix mb-3">
                <h4>Le numèro du stand: {{stand.numero}}</h4>
                <p>L'emplacement du stand: {{stand.emplacement}}</p>
                <p>Le prix de location : {{stand.tarif_de_location}}</p>
                <p>Le status du stand: {{stand.status}}</p>
            </div>
        </div>
    </div>
</div>
