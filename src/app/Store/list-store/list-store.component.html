<h1>Liste des Magasins</h1>
<div class="t">
  <div class="input-group w-50" id="r">
    <span class="input-group-text" id="basic-addon1">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
      </svg>
    </span>
    <span>
      <input type="text" class="form-control" name="nomMagasin" [(ngModel)]="nameStore" (ngModelChange)="getBoutiquesByName(nameStore)" placeholder="entrer nom de magasin" aria-label="Input group example" aria-describedby="basic-addon1">
    </span>
  </div>
  <table class="table table-striped table-bordered table-md mt-1" cellspacing="0">
    <thead>
      <tr>
        <th class="th-sm" scope="col" (click)="sort('idStore')">ID&nbsp; <i class="fa fa-sort"></i></th>
        <th class="th-sm" scope="col" (click)="sort('nameStore')">Nom de magasin&nbsp; <i class="fa fa-sort"></i></th>
        <th class="th-sm" scope="col" (click)="sort('phoneNumber')">Numéro de téléphone&nbsp; <i class="fa fa-sort"></i></th>
        <th class="th-sm" scope="col" (click)="sort('description')">Description&nbsp; <i class="fa fa-sort"></i></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let magasin of magasins | orderBy: key: reverse | paginate: {itemsPerPage: 5, currentPage: p};">
        <th scope="row">{{magasin.idStore}}</th>
        <td>{{magasin.nameStore}}</td>
        <td>{{magasin.phoneNumber}}</td>
        <td>{{magasin.description}}</td>
      </tr>
    </tbody>

    <pagination-controls (pageChange)="p = $event"></pagination-controls>

  </table>

  <router-outlet></router-outlet>
</div>
