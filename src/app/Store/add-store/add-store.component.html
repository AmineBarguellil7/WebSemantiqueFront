<h2>Boutique Promotions</h2>
<table class="table table-striped table-bordered table-md mt-1" cellspacing="0">
  <thead>
    <tr>
      <th>Boutique Name</th>
      <th>Promotion Percentage</th>
      <th>Start Date</th>
      <th>End Date</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of boutiquePromotions">
      <td>{{ item.nameStore }}</td>
      <td>{{ item.percentage }}</td>
      <td>{{ item.startDate }}</td>
      <td>{{ item.endDate }}</td>
    </tr>
  </tbody>
</table>
