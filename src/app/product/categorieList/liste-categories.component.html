<h1>Category List</h1>

<form class="form-inline my-2 my-lg-0">
  <button class="btn btn-info" (click)="filterCategoryByName()">
    Search By Name
  </button>
  <input
    class="form-control mr-sm-2"
    type="text"
    id="nameFilter"
    placeholder="Rechercher Par nom"
    aria-label="Search"
    [(ngModel)]="nameCategorie"
    name="SearchInputName"
  />
</form>
<br /><br />

<button class="btn btn-success" (click)="reloadCategories()">Reload Categories</button>

<table>
  <tr>
    <td>Name</td>
    <td>Description</td>
  </tr>
  <tr *ngFor="let category of categories">
    <td>{{ category.nameCategorie }}</td>
    <td>{{ category.DescriptionCategorie }}</td>
  </tr>
</table>
