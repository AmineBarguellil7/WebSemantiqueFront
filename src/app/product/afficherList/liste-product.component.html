<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Page Title</title>
    <!-- Add the path to your custom CSS file here -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css" />
  </head>
  <body>
    <h1>Product List</h1>
    <form class="form-inline my-2 my-lg-0">
      <button class="btn btn-info" (click)="filterByName()">Search By Name</button>
      <input class="form-control mr-sm-2" type="text" placeholder="Rechercher Par nom" aria-label="Search" [(ngModel)]="name" name="SearchInputName">
    </form>
    
    
    <div>
      <label for="priceFilter">Filter by Price:</label>
      <input
        type="number"
        id="priceFilter"
        [(ngModel)]="price"
        (ngModelChange)="filterProductsByPrice()"
      />
    </div>

    <div>
      <label for="categoryDropdown">Filter by Category:</label>
      <select
        id="categoryDropdown"
        [(ngModel)]="category"
        (change)="searchByCategory()"
      >
        <option value="">Select Category</option>
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <table>
      <tr>
        <td>ID</td>
        <td>Name</td>
        <td>Description</td>
        <td>Price</td>
        <td>Quantity</td>
        <td>Weight</td>
        <!-- <td>Category</td> Add a new table header for Category -->
      </tr>
      <tr *ngFor="let product of products">
        <td>{{ product.idProduct }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.description }}</td>
        <td>{{ product.price }}</td>
        <td>{{ product.quantity }}</td>
        <td>{{ product.weight }}</td>
        <!-- <td>{{ product.category.name }}</td> Access the category name -->
      </tr>
    </table>
  </body>
</html>
